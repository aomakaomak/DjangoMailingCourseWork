{% extends 'mailing/base.html' %}

{% block title %}Добавление сообщения{% endblock %}

{% block content %}
{% include 'mailing/header.html' %}

<h2>Форма для добавления сообщения</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailing:messages_list' %}" class="btn btn-primary">Отменить</a>
</form>

{% endblock %}
